name: Construire l'appli

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature (Secrets GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Les secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD sont manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Vérifier que l'APK est bien signé
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk MonIPTV.apk

      - name: Garder une copie
        uses: actions/upload-artifact@v4
        with:
          name: MonIPTV
          path: MonIPTV.apk

      - name: Supprimer l'ancienne version publiée
        run: gh release delete latest --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publier (lien de téléchargement fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mon IPTV – dernière version
          body: "Version ${{ github.run_number }}. Lien direct pour la Freebox : https://github.com/${{ github.repository }}/releases/latest/download/MonIPTV.apk"
          files: MonIPTV.apk
          make_latest: true
