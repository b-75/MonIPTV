name: Construire l'appli

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk MonIPTV.apk

      - name: Garder une copie
        uses: actions/upload-artifact@v4
        with:
          name: MonIPTV
          path: MonIPTV.apk

      - name: Supprimer l'ancienne version publiée
        run: gh release delete latest --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publier (lien de téléchargement fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mon IPTV – dernière version
          body: "Version ${{ github.run_number }}. Lien direct pour la Freebox : https://github.com/${{ github.repository }}/releases/latest/download/MonIPTV.apk"
          files: MonIPTV.apk
          make_latest: true
